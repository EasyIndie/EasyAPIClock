name: GudengClock

options:
  bundleIdPrefix: com.easyindie.easyapiclock
  deploymentTarget:
    macOS: "13.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      # A local SwiftPM package is built for the active architecture. Building
      # both arm64 and x86_64 slices in Debug can leave the second slice without
      # a matching package module, so local Debug builds stay single-arch.
      ONLY_ACTIVE_ARCH: YES

packages:
  Gudeng:
    path: Packages/Gudeng

targets:
  GudengMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
      - path: Rules
        type: folder
        buildPhase: resources
    dependencies:
      - package: Gudeng
        product: GudengKit
    # This file is regenerated by XcodeGen; edit the properties here, not the plist.
    entitlements:
      path: Apps/Mac/GudengMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    # Generated into Build/Generated; source of truth is this file.
    info:
      path: Build/Generated/GudengMac-Info.plist
      properties:
        CFBundleDisplayName: 谷蹬
        CFBundleName: GudengMac
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Gudeng contributors"
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GudengRuleSourceBaseURL: "https://raw.githubusercontent.com/EasyIndie/EasyAPIClock/rules"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easyindie.easyapiclock
        PRODUCT_NAME: GudengMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES

  GudengiOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/Sources
      - path: Rules
        type: folder
        buildPhase: resources
    dependencies:
      - package: Gudeng
        product: GudengKit
    # Generated into Build/Generated; source of truth is this file.
    info:
      path: Build/Generated/GudengiOS-Info.plist
      properties:
        CFBundleDisplayName: 谷蹬
        CFBundleName: GudengiOS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.easyindie.easyapiclock.ios
        PRODUCT_NAME: GudengiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  GudengMac:
    build:
      targets:
        GudengMac: all
    run:
      config: Debug
    archive:
      config: Release

  GudengiOS:
    build:
      targets:
        GudengiOS: all
    run:
      config: Debug
    archive:
      config: Release
