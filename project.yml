name: LiangWenClock

options:
  bundleIdPrefix: app.liangwen
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      # A local SwiftPM package is built for the active architecture. Building
      # both arm64 and x86_64 slices in Debug can leave the second slice without
      # a matching package module, so local Debug builds stay single-arch.
      ONLY_ACTIVE_ARCH: YES

packages:
  LiangWen:
    path: Packages/LiangWen

targets:
  LiangWenMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/Mac/Sources
      - path: Rules
        type: folder
        buildPhase: resources
    dependencies:
      - package: LiangWen
        product: LiangWenKit
    # This file is regenerated by XcodeGen; edit the properties here, not the plist.
    entitlements:
      path: Apps/Mac/LiangWenMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    # Generated into Build/Generated; source of truth is this file.
    info:
      path: Build/Generated/LiangWenMac-Info.plist
      properties:
        CFBundleDisplayName: 谷蹬
        CFBundleName: LiangWenMac
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Gudeng contributors"
        NSPrincipalClass: NSApplication
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LiangWenRuleSourceBaseURL: "https://raw.githubusercontent.com/wangzhizhou/liangwen-clock/rules"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.liangwen.mac
        PRODUCT_NAME: LiangWenMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES

  LiangWeniOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/Sources
      - path: Rules
        type: folder
        buildPhase: resources
    dependencies:
      - package: LiangWen
        product: LiangWenKit
    # Generated into Build/Generated; source of truth is this file.
    info:
      path: Build/Generated/LiangWeniOS-Info.plist
      properties:
        CFBundleDisplayName: 谷蹬
        CFBundleName: LiangWeniOS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.liangwen.ios
        PRODUCT_NAME: LiangWeniOS
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  LiangWenMac:
    build:
      targets:
        LiangWenMac: all
    run:
      config: Debug
    archive:
      config: Release

  LiangWeniOS:
    build:
      targets:
        LiangWeniOS: all
    run:
      config: Debug
    archive:
      config: Release
