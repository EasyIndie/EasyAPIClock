---
name: Feature request
description: 提议新功能或体验改进
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        梁文钟刻意保持极小范围。请先确认提议属于首版范围（见 docs/product/requirements.md），
        并说明它如何帮助用户回答「现在贵还是便宜 / 还有多久切换 / 如何提醒」。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述用户场景，而不是直接给实现
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 范围检查
      description: 说明为什么它不属于账号、API Key、统计、番茄钟、任务管理、自动切换模型或硬件管理
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我阅读了产品需求与设计基准，提议没有回退到信息更复杂的版本
          required: true
        - label: 如果涉及价格或日期语义，我愿意提供官方来源与核对日期
          required: false
