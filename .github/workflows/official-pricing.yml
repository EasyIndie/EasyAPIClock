name: Official pricing

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [observe, prepare]
        default: observe
        description: Observe only, or prepare a maintainer-verified price-only candidate
      expected_digest:
        description: Copy the exact observation digest after reviewing the report
        type: string
      effective_from:
        description: Officially verified effective time, ISO8601 with +08:00 (never the fetch time)
        type: string
      evidence:
        description: Official api-docs.deepseek.com HTTPS evidence URL for the effective time
        type: string
        default: https://api-docs.deepseek.com/zh-cn/quick_start/pricing/

permissions:
  contents: read

concurrency:
  group: official-pricing
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'schedule' || inputs.mode != 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore official source cache
        uses: actions/cache@v4
        with:
          path: .build/official-pricing/state.json
          key: official-pricing-state-${{ github.run_id }}
          restore-keys: |
            official-pricing-state-
      - name: Test bounded parser without network
        run: python3 -m unittest discover -s Scripts/tests -p 'test_official_pricing.py'
      - name: Observe official HTTPS source
        run: python3 Scripts/official_pricing.py observe
      - name: Record summary
        run: cat .build/official-pricing/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep evidence even when parsing requires review
        uses: actions/upload-artifact@v7
        with:
          name: official-pricing-observation
          path: .build/official-pricing/report.*
          retention-days: 14
      - name: Maintain one review issue, without repeated unchanged notifications
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/official_pricing_actions.py notify

  prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare'
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Refetch and prepare only the explicitly verified price candidate
        env:
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          EFFECTIVE_FROM: ${{ inputs.effective_from }}
          SOURCE_EVIDENCE: ${{ inputs.evidence }}
        run: |
          python3 Scripts/official_pricing.py prepare \
            --expected-digest "$EXPECTED_DIGEST" \
            --effective-from "$EFFECTIVE_FROM" \
            --evidence "$SOURCE_EVIDENCE"
      - name: Validate candidate, independent snapshot and formatting
        run: |
          make validate-rules
          make test
          make lint
          git diff --check
      - name: Preserve review material if preparation or validation fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-pricing-candidate-report
          path: .build/official-pricing/report.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Create a draft PR, never merge or publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 Scripts/official_pricing_actions.py pull-request
