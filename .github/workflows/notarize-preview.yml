name: Notarize preview

# Builds, signs and notarizes the current main without creating a GitHub
# Release. The notarized app and EasyRelease manifest are uploaded as a
# workflow artifact for local acceptance. Use Publish macOS Release only after
# this preview has been verified.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to preview"
        type: string
        default: main

permissions:
  contents: write

jobs:
  preview:
    uses: EasyIndie/EasyRelease/.github/workflows/apple-release.yml@1b2ccaec5bec0a557e86e11e28c9459a0b7c5633
    with:
      runs_on: macos-15
      kit_ref: 1b2ccaec5bec0a557e86e11e28c9459a0b7c5633
      checkout_ref: ${{ inputs.ref }}
      app: EasyAPIClock
      bundle_id: com.easyindie.easyapiclock
      version: "1.0.0"
      build_number: "4"
      artifact: .build/DerivedData-Release/Build/Products/Release/GudengMac.app
      build_command: Scripts/install-xcodegen.sh && grep -q 'MARKETING_VERSION: "1.0.0"' project.yml && make check && make build-mac-universal
      entitlements: Apps/Mac/GudengMac.entitlements
      mode: developer-id
      notarize: true
      staple: true
      dry_run: false
      upload_artifact: true
      release: false
    secrets: inherit
