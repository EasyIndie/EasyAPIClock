name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Rules + tests + lint
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Check module boundaries
        run: make check-layers

      - name: Test official-source monitor offline
        run: make test-source-monitor

      - name: Lint Swift
        run: make lint

      - name: Validate bundled rule bundle
        run: swift run --package-path Packages/Gudeng gudeng-rules validate Rules

      - name: Run tests
        run: swift test --package-path Packages/Gudeng

  build:
    name: Build macOS + iOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache pinned XcodeGen
        uses: actions/cache@v6
        with:
          path: .build/tools
          key: xcodegen-${{ runner.os }}-${{ hashFiles('.xcodegen-version', 'Scripts/install-xcodegen.sh') }}

      - name: Install pinned XcodeGen
        run: Scripts/install-xcodegen.sh

      - name: Check toolchain
        run: Scripts/doctor.sh

      - name: Generate project
        run: .build/tools/xcodegen/bin/xcodegen generate

      - name: Build macOS app
        run: |
          xcodebuild -project GudengClock.xcodeproj \
            -scheme GudengMac \
            -configuration Debug \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Verify bundled rules
        run: test -f .build/DerivedData/Build/Products/Debug/GudengMac.app/Contents/Resources/Rules/manifest.json

      - name: Build macOS Release (universal)
        run: |
          xcodebuild -project GudengClock.xcodeproj \
            -scheme GudengMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/DerivedData-Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build
          python3 Scripts/verify-mac-build.py .build/DerivedData-Release/Build/Products/Release/GudengMac.app
          test -f .build/DerivedData-Release/Build/Products/Release/GudengMac.app/Contents/Resources/Rules/manifest.json

      - name: Build iOS app
        run: |
          xcodebuild -project GudengClock.xcodeproj \
            -scheme GudengiOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData-iOS \
            CODE_SIGNING_ALLOWED=NO build
