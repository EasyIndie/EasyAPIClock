name: Publish macOS Release

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: "Create a public GitHub Release from the main branch"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.confirm_publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and create immutable tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(awk -F '"' '/MARKETING_VERSION:/ { print $2; exit }' project.yml)"
          BUILD="$(awk -F '"' '/CURRENT_PROJECT_VERSION:/ { print $2; exit }' project.yml)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$BUILD" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; increment MARKETING_VERSION before publishing again." >&2
            exit 1
          fi

          # Use the Git transport to check the exact ref. GitHub's REST ref
          # endpoint can follow repository-transfer redirects, which may
          # report stale refs from the former repository owner.
          EXISTING_SHA="$(git ls-remote --refs origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$EXISTING_SHA" ]]; then
            if [[ "$EXISTING_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to $EXISTING_SHA, not $GITHUB_SHA; refusing to move it." >&2
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$GITHUB_SHA"
          fi
          echo "Prepared EasyAPIClock $VERSION ($BUILD) at $GITHUB_SHA"

  publish:
    needs: prepare
    uses: EasyIndie/EasyRelease/.github/workflows/apple-release.yml@1b2ccaec5bec0a557e86e11e28c9459a0b7c5633
    with:
      runs_on: macos-15
      kit_ref: 1b2ccaec5bec0a557e86e11e28c9459a0b7c5633
      checkout_ref: v${{ needs.prepare.outputs.version }}
      app: EasyAPIClock
      bundle_id: com.easyindie.easyapiclock
      version: ${{ needs.prepare.outputs.version }}
      build_number: ${{ needs.prepare.outputs.build }}
      artifact: .build/DerivedData-Release/Build/Products/Release/GudengMac.app
      build_command: Scripts/install-xcodegen.sh && make check && make build-mac-universal
      entitlements: Apps/Mac/GudengMac.entitlements
      mode: developer-id
      notarize: true
      staple: true
      release: true
      release_tag: v${{ needs.prepare.outputs.version }}
    secrets: inherit

  release-notes:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add Gudeng install and signing notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## 谷蹬 ${{ needs.prepare.outputs.version }}

          DeepSeek API 峰谷钟点提醒。最低支持 macOS 13.0，提供 Apple silicon 与 Intel 通用版本。

          ### 安装
          下载 ZIP 并解压，将「谷蹬」拖入「应用程序」文件夹。

          ### 签名与公证
          此版本使用 Developer ID 签名，通过 Apple 公证并完成 staple。manifest 记录应用版本、build、签名及公证状态；SHA-256 文件可在下载目录直接校验。

          本版 Bundle ID 为 com.easyindie.easyapiclock；v0.1.0 使用旧标识。系统偏好、通知授权和沙盒数据不会从旧标识自动迁移。

          社区项目，与 DeepSeek 官方无隶属关系。当前规则覆盖范围与通知限制见仓库文档。
          EOF
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            -f body="$(cat "$RUNNER_TEMP/release-notes.md")"
